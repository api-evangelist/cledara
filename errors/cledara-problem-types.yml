problem_types:
  - status: 401
    title: Missing or invalid API key
    declared_on:
      - GET /v0/applications
      - GET /v0/transactions
      - GET /v0/transactions/{transactionId}/invoice-url
    causes:
      - No Authorization header
      - Malformed Authorization header (not "Bearer <token>")
      - Unknown, revoked or deleted API key
    remediation: >-
      Mint a key in the Cledara web app under Settings → Profile Details → API Keys and
      send it as "Authorization: Bearer <key>".
    retryable: false
  - status: 403
    title: Insufficient privileges for this account
    declared_on:
      - GET /v0/applications
      - GET /v0/transactions
      - GET /v0/transactions/{transactionId}/invoice-url
    causes:
      - The user who created the key does not have access to the requested account or workspace
    remediation: >-
      An API key carries exactly the permissions of the user who created it. Have the key
      recreated by a user with the required role rather than retrying.
    retryable: false
  - status: 404
    title: Record not found
    declared_on:
      - GET /v0/transactions/{transactionId}/invoice-url
    causes:
      - transactionId does not exist
      - transaction exists but has no invoice attached (see Transaction.hasInvoice)
    remediation: >-
      Check Transaction.hasInvoice from GET /v0/transactions before requesting an invoice URL.
    retryable: false
  - status: 429
    title: Too many requests
    declared_on:
      - GET /v0/applications
      - GET /v0/transactions
      - GET /v0/transactions/{transactionId}/invoice-url
    causes:
      - More than 120 requests in a minute on one API key
    remediation: >-
      Wait the number of seconds in the Retry-After response header, then retry. Pace against
      X-RateLimit-Remaining and X-RateLimit-Reset on every 2xx response.
    response_headers:
      - Retry-After
      - X-RateLimit-Remaining
    retryable: true
