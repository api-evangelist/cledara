  - date: '2026-08-27'
    title: The Cledara API is live
    tags: [New Feature, Announcement]
    breaking: false
    additions:
      - 'Public REST API launched with three read-only endpoints: applications, transactions, and transaction invoice URLs.'
      - API keys self-served from Settings → Profile Details → API Keys.
      - Included on every plan at no extra cost.
    highlights: >-
      Positioned explicitly for agents as well as developers — "your dashboard, your accounting
      system, or your AI assistant (Claude, ChatGPT, or your agent of choice)" and "you do not
      need a developer. Your AI coding agent reads the docs, takes an API key, and builds the
      integration for you."
    links:
      - https://api-docs.cledara.com/
      - https://www.cledara.com/blog/introducing-the-cledara-api
  - date: '2026-05-21'
    title: 'Invoice Manager: turn invoices into insights with AI'
    tags: [New Feature, Announcement]
    region: UK / EEA
    breaking: false
    additions:
      - AI extraction of invoice number, date and VAT rate from uploaded invoices.
      - Claimable VAT Breakdown chart in Reports and per-application historical spend.
      - Auto-confirm for trusted applications.
    api_impact: >-
      Surfaces in the API as Transaction.invoiceDetails {number, date, vat}, documented as
      "only available for confirmed invoices".
