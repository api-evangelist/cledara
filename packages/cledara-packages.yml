finding: >-
  Cledara publishes NO client libraries. There is no first-party SDK on npm, PyPI, RubyGems,
  crates.io, Packagist, Maven Central, NuGet or pkg.go.dev, and no first-party CLI. Callers
  hand-roll HTTP against a three-operation Bearer-token API.
