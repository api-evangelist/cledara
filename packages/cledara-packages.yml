notes:
  - >-
    Cledara's own launch messaging treats the absence of an SDK as a feature: "you do not need
    a developer. Your AI coding agent reads the docs, takes an API key, and builds the
    integration for you." The OpenAPI at api-docs.cledara.com is the distribution mechanism,
    with a coding agent as the generator.
  - >-
    No abandonment signal can be read here because there is nothing published to go stale. That
    is a different and more honest finding than a stale SDK.
