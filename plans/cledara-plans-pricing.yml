specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Cledara
providerId: cledara
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://www.cledara.com/pricing
note: >-
  Replaces the 2026-05-04 scaffold, whose Free/Professional/Enterprise tiers and request
  quotas were bulk-sweep defaults that Cledara does not publish. Cledara sells a SaaS
  management seat-and-application subscription, not API capacity: all three plans advertise
  "Unlimited API access", and the API is included at no extra cost on every plan.
currency: GBP
billing_periods:
  - monthly
  - yearly
annual_discount: 16%
api_pricing_model: included-in-all-plans
api_metered: false
plan_count: 3
addon_count: 3
plans:
  - id: cledara-basic
    name: Basic
    type: paid
    price: '100.00'
    currency: GBP
    period: month
    target: Typically 25-50 staff
    promotion: >-
      Free if you pay for 10 or more applications via Cledara cards in the first month.
    limits:
      - label: Applications
        metric: applications
        limit: 20
      - label: API access
        metric: api_access
        limit: unlimited
        quote: Unlimited API access
    elements:
      - Software directory
      - Renewal alerts
      - Spend overview
      - Payment and cancellation management
      - Budget controls
      - Xero and QuickBooks integrations
      - Unlimited API access
  - id: cledara-premium
    name: Premium
    type: paid
    price: null
    price_note: Not published; the page routes to "Book a Demo".
    currency: GBP
    period: month
    target: Typically 51-150 staff
    promotion: 1% cashback for the first year, capped at the subscription cost.
    limits:
      - label: Applications
        metric: applications
        limit: 75
      - label: API access
        metric: api_access
        limit: unlimited
      - label: Cledara Spend active members
        metric: members
        limit: 10
        overage: 'GBP 5.00 per additional member per month'
    elements:
      - Everything in Basic
      - Approval workflows
      - Invoice automation
      - Advanced reporting
      - NetSuite integration
      - Advanced approvals
      - Video support
      - Unlimited API access
  - id: cledara-pro
    name: Pro
    type: enterprise
    price: null
    price_note: '"from" price shown without a figure; the page routes to "Book a Demo".'
    currency: GBP
    period: month
    target: Typically 151+ staff
    promotion: 1% cashback for the first year.
    limits:
      - label: Applications
        metric: applications
        limit: custom
        note: '"A package designed for you"'
      - label: API access
        metric: api_access
        limit: unlimited
      - label: Cledara Spend active members
        metric: members
        limit: 50
        overage: 'GBP 5.00 per additional member per month'
    elements:
      - Everything in Premium
      - Okta SSO
      - Bank transfer payments
      - Dedicated implementation manager
      - Dedicated success manager
      - Spend reviews
      - Unlimited API access
addons:
  - id: spend-optimization
    name: Spend Optimization
    price_monthly: '200.00'
    price_yearly: '1500.00'
    currency: GBP
    note: 'GBP 150.00 per month with a GBP 50 checkout discount.'
    elements:
      - Usage insights
      - Duplicate and price alerts
      - Benchmarks
      - AI copilot
  - id: it-management
    name: IT Management
    price_monthly: '150.00'
    price_yearly: '1500.00'
    currency: GBP
    elements:
      - Access workflows
      - Shadow IT detection
      - Onboarding and offboarding
      - HR integration
  - id: software-compliance
    name: Software Compliance
    price_monthly: '150.00'
    price_yearly: '1500.00'
    currency: GBP
    elements:
      - ISO 27001 and SOC 2 checks
      - Compliance questionnaires
      - Customizable templates
included_products:
  - name: Cledara Spend
    availability: all plans
    elements:
      - 30 free business and travel cards
      - Spend limits
      - Apple Pay and Google Pay
      - Receipt tracking
      - Accounting sync
related_surfaces:
  - name: Cledara SaaS Market Data Hub
    url: https://data.cledara.com/
    pricing: >-
      The public dataset is free to read and free to cite with a link. Bulk/programmatic
      access is sales-gated behind a mailto (b@cledara.com, subject "API Access Request").
      The MCP endpoint at https://data.cledara.com/mcp requires OAuth and publishes no price.
maintainers:
  - FN: Kin Lane
    email: kinlane@gmail.com
