    path: /v0/transactions
    reason: Workspace-scoped transaction list; no MCP tool fronts the caller's own workspace.
    note: The spec declares no operationId; the id here is a stable local label, not a provider-published one.
  - operation: getTransactionInvoiceUrl
    method: GET
    path: /v0/transactions/{transactionId}/invoice-url
    reason: Workspace-scoped invoice download link; no MCP tool fronts the caller's own workspace.
    note: The spec declares no operationId; the id here is a stable local label, not a provider-published one.
